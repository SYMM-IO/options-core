arrowParens: avoid
bracketSpacing: true
endOfLine: auto
printWidth: 150
singleQuote: false
tabWidth: 4
trailingComma: all
useTabs: true

plugins:
    - prettier-plugin-solidity

overrides:
    - files: "*.ts"
      options:
          tabWidth: 2
          semi: false
    - files: "*.sol"
      options:
          parser: solidity-parse
